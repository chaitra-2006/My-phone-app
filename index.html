<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C-Chat</title><link rel="icon" href="logo.png"><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#F5F3FF}.p{display:none}.p.a{display:flex;min-height:100vh}#l{background:linear-gradient(135deg,#7B61FF,#5A3EFF);justify-content:center;align-items:center;padding:20px}.c{background:#fff;padding:20px;border-radius:20px;width:100%;max-width:320px;text-align:center}.logo{width:70px;height:70px;border-radius:14px;margin:0 auto 8px;display:block}#cam{width:70px;height:70px;border-radius:50%;background:#000;margin:8px auto;display:block}.b{width:100%;padding:11px;border:none;border-radius:10px;background:#7B61FF;color:#fff;font-weight:700;margin-top:8px}.phone{width:100%;max-width:400px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column;position:relative}.t{background:#7B61FF;color:#fff;padding:12px;display:flex;justify-content:space-between}.t img{width:28px;height:28px;border-radius:6px;background:#fff}.id{background:#F0F0FF;margin:8px;padding:7px;border-radius:8px;font-size:10px;text-align:center;color:#7B61FF;font-weight:700;word-break:break-all}.tp{display:none;flex:1;overflow:auto;padding-bottom:65px}.tp.a{display:block}.bn{position:absolute;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center}.ni{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#999}.ni.a{color:#7B61FF}.it{display:flex;align-items:center;padding:10px;border-bottom:1px solid #f0f0f0}.av{width:36px;height:36px;border-radius:50%;background:#EDE7FF;margin-right:8px;overflow:hidden}.av img{width:100%;height:100%}#cw{position:fixed;top:0;left:0;width:100%;height:100%;background:#EFE7FF;z-index:20;display:none;flex-direction:column;max-width:400px;left:50%;transform:translateX(-50%)}#cm{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}.m{max-width:70%;padding:8px 10px;border-radius:14px;font-size:13px}.me{align-self:flex-end;background:#7B61FF;color:#fff}.ot{align-self:flex-start;background:#fff}#vo{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;z-index:30;display:none;flex-direction:column;max-width:400px;left:50%;transform:translateX(-50%)}#vo video{width:100%;height:100%;object-fit:cover}#lv{position:absolute;top:15px;right:15px;width:80px;height:110px;border-radius:10px;border:2px solid #fff}</style></head><body><div id="l" class="p a"><div class="c"><img src="logo.png" class="logo"><h2 style="color:#7B61FF">C-Chat</h2><video id="cam" autoplay muted playsinline></video><input id="nameIn" placeholder="Your Name" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-top:8px"><button class="b" onclick="login()">Continue</button></div></div><div id="app" class="p"><div class="phone"><div class="t"><div style="display:flex;gap:6px;align-items:center"><img src="logo.png"><b id="hi">C-Chat</b></div><span onclick="localStorage.clear();location.reload()" style="font-size:11px">Logout</span></div><div class="id" id="myId">Generating...</div><div id="tabChats" class="tp a"><div style="padding:6px;display:flex;gap:4px"><input id="friendId" placeholder="Friend ID" style="flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;font-size:11px"><button onclick="copyId()" style="padding:8px;background:#7B61FF;color:#fff;border:none;border-radius:8px">Copy</button></div><div style="padding:0 6px 6px"><button onclick="connectFriend()" style="width:100%;padding:8px;background:#00C851;color:#fff;border:none;border-radius:8px;font-weight:700">Connect</button></div><div id="contactsList"></div></div><div id="tabDial" class="tp"><div style="padding:8px;text-align:center"><input id="dialInput" placeholder="Paste ID" style="width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;text-align:center;font-weight:700;font-size:12px"></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 20px"><button onclick="addDial('1')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">1</button><button onclick="addDial('2')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">2</button><button onclick="addDial('3')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">3</button><button onclick="addDial('4')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">4</button><button onclick="addDial('5')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">5</button><button onclick="addDial('6')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">6</button><button onclick="addDial('7')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">7</button><button onclick="addDial('8')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">8</button><button onclick="addDial('9')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">9</button><button onclick="addDial('*')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">*</button><button onclick="addDial('0')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">0</button><button onclick="addDial('#')" style="width:50px;height:50px;border-radius:50%;border:none;background:#F0F0FF;margin:0 auto">#</button></div><button onclick="callFromDial(true)" style="width:50px;height:50px;border-radius:50%;background:#00C851;border:none;color:#fff;margin:8px auto;display:block">📹</button></div><div id="tabHistory" class="tp"><h3 style="padding:10px">History</h3><div id="historyList"></div></div><div id="tabVideo" class="tp" style="padding:12px;text-align:center"><img src="logo.png" style="width:60px;border-radius:12px;margin:12px auto;display:block"><p id="myId2" style="font-size:9px;color:#7B61FF;word-break:break-all"></p><button onclick="doCall(true)" class="b">📹 Call</button></div><div class="bn"><div class="ni a" onclick="showTab('Chats')"><b>💬</b><span>Chats</span></div><div class="ni" onclick="showTab('Dial')"><b>🔢</b><span>Dial</span></div><div class="ni" onclick="showTab('History')"><b>🕒</b><span>History</span></div><div class="ni" onclick="showTab('Video')"><b>📹</b><span>Video</span></div></div><div id="cw"><div style="background:#7B61FF;color:#fff;padding:10px;display:flex;gap:8px;align-items:center"><span onclick="closeChat()">←</span><img src="logo.png" style="width:24px;height:24px;border-radius:50%"><b id="chatName" style="flex:1">Friend</b><button onclick="doCall(true)" style="width:24px;height:24px;border-radius:50%;border:none">📹</button></div><div id="cm"></div><div style="display:flex;padding:6px;gap:4px;background:#fff"><input id="msgIn" placeholder="Type..." style="flex:1;padding:8px;border-radius:18px;border:none;background:#F0F0FF"><button onclick="sendReal()" style="width:36px;height:36px;border-radius:50%;border:none;background:#7B61FF;color:#fff">➤</button></div></div><div id="vo"><video id="remoteV" autoplay playsinline></video><video id="localV" autoplay muted playsinline></video><div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%)"><button onclick="endCall()" style="width:45px;height:45px;border-radius:50%;border:none;background:red;color:#fff">✕</button></div></div></div></div><script>let peer,localStream,currentCall,currentConn,currentChat=null,msgs={},contacts=[],historyLog=[];navigator.mediaDevices.getUserMedia({video:true}).then(s=>{document.getElementById('cam').srcObject=s}).catch(()=>{});function showTab(t){document.querySelectorAll('.tp').forEach(p=>p.classList.remove('a'));document.querySelectorAll('.ni').forEach(n=>n.classList.remove('a'));document.getElementById('tab'+t).classList.add('a');let i={Chats:0,Dial:1,History:2,Video:3}[t];document.querySelectorAll('.ni')[i].classList.add('a');}function addDial(d){document.getElementById('dialInput').value+=d}function login(){let n=document.getElementById('nameIn').value.trim();if(!n){alert('Enter name');return}localStorage.setItem('cname',n);navigator.mediaDevices.getUserMedia({video:true,audio:{echoCancellation:true}}).then(s=>{localStream=s;document.getElementById('l').classList.remove('a');document.getElementById('app').classList.add('a');document.getElementById('hi').innerText=n;initPeer();});}function initPeer(){peer=new Peer();peer.on('open',id=>{document.getElementById('myId').innerText='ID:'+id;document.getElementById('myId2').innerText=id;document.getElementById('dialInput').value=id;});peer.on('connection',c=>{currentConn=c;setupConn(c);let n=c.peer.slice(0,8);addContact(n,c.peer);addHistory(n,'Chat');});peer.on('call',call=>{if(confirm('Call?')){document.getElementById('vo').style.display='flex';call.answer(localStream);call.on('stream',s=>{document.getElementById('remoteV').srcObject=s;document.getElementById('localV').srcObject=localStream});currentCall=call;}});}function connectFriend(){let f=document.getElementById('friendId').value.trim()||document.getElementById('dialInput').value.trim();if(!f){alert('Paste ID');return}let c=peer.connect(f);c.on('open',()=>{currentConn=c;setupConn(c);let n=f.slice(0,8);addContact(n,f);openChat(n,f);addHistory(n,'Chat');});}function setupConn(c){c.on('data',d=>{let n=c.peer.slice(0,8);if(!msgs[n])msgs[n]=[];msgs[n].push({t:d,me:false});if(currentChat===n){let m=document.createElement('div');m.className='m ot';m.innerText=d;document.getElementById('cm').appendChild(m);}});}function doCall(v){let f=document.getElementById('friendId').value.trim()||document.getElementById('dialInput').value.trim();if(!f){alert('Paste ID');return}document.getElementById('vo').style.display='flex';let call=peer.call(f,localStream);call.on('stream',s=>{document.getElementById('remoteV').srcObject=s;document.getElementById('localV').srcObject=localStream});currentCall=call;addHistory(f.slice(0,8),v?'Video':'Voice');}function callFromDial(v){document.getElementById('friendId').value=document.getElementById('dialInput').value;doCall(v)}function endCall(){currentCall?.close();document.getElementById('vo').style.display='none';}function copyId(){let id=document.getElementById('myId').innerText.replace('ID:','');navigator.clipboard.writeText(id);alert('Copied');}function addContact(n,id){if(!contacts.find(c=>c.id===id)){contacts.unshift({name:n,id:id});renderContacts();}}function renderContacts(){let h='';contacts.forEach(c=>{h+=`<div class="it" onclick="openChat('${c.name}','${c.id}')"><div class="av"><img src="logo.png"></div><div style="flex:1"><b>${c.name}</b><div style="font-size:10px;color:#888">${c.id.slice(0,10)}</div></div></div>`});if(!h)h='<div style="padding:20px;text-align:center;color:#888">No chats</div>';document.getElementById('contactsList').innerHTML=h;}function addHistory(n,t){historyLog.unshift({name:n,type:t,time:new Date().toLocaleTimeString()});let h='';historyLog.forEach(l=>{h+=`<div class="it"><div class="av" style="background:#F0F0FF">${l.type.includes('Video')?'📹':'📞'}</div><div style="flex:1"><b>${l.name}</b><div style="font-size:10px;color:#888">${l.type} ${l.time}</div></div></div>`});document.getElementById('historyList').innerHTML=h;}function openChat(n,id){currentChat=n;document.getElementById('chatName').innerText=n;document.getElementById('friendId').value=id;document.getElementById('dialInput').value=id;document.getElementById('cw').style.display='flex';let b=document.getElementById('cm');b.innerHTML='';(msgs[n]||[]).forEach(m=>{let d=document.createElement('div');d.className='m '+(m.me?'me':'ot');d.innerText=m.t;b.appendChild(d);});}function closeChat(){document.getElementById('cw').style.display='none';}function sendReal(){let i=document.getElementById('msgIn');if(!i.value.trim())return;if(!msgs[currentChat])msgs[currentChat]=[];msgs[currentChat].push({t:i.value,me:true});let d=document.createElement('div');d.className='m me';d.innerText=i.value;document.getElementById('cm').appendChild(d);if(currentConn&&currentConn.open)currentConn.send(i.value);i.value='';}</script></body></html>
