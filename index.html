*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial}
body{background:#F5F3FF}
.page{display:none}.page.active{display:flex;min-height:100vh}

.btn{width:100%;padding:13px;border:none;border-radius:12px;background:#7B61FF;color:#fff;font-weight:700;margin-top:10px;font-size:15px}
.phone{width:100%;max-width:400px;margin:0 auto;background:#fff;min-height:100vh;display:flex;
