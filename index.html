<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mood Scan</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:sans-serif;display:flex;justify-content:center}
.box{width:100%;max-width:380px;padding:20px}
h3{font-weight:400;text-align:center;margin:10px 0;color:#ccc}
.camera{position:relative;width:100%;height:360px;background:#000;border-radius:18px;overflow:hidden;border:1px solid #2a2a2a}
video{width:100%;height:100%;object-fit:cover}
.scan-line{position:absolute;top:0;left:0;width:100%;height:2px;background:#fff;box-shadow:0 0 8px #fff;animation:move 2.5s linear infinite}
@keyframes move{0%{top:0}50%{top:100%}100%{top:0}}
.corner{position:absolute;width:28px;height:28px;border-color:#fff}
.c1{top:16px;left:16px;border-top:1.5px solid;border-left:1.5px solid}
.c2{top:16px;right:16px;border-top:1.5px solid;border-right:1.5px solid}
.c3{bottom:16px;left:16px;border-bottom:1.5px solid;border-left:1.5px solid}
.c4{bottom:16px;right:16px;border-bottom:1.5px solid;border-right:1.5px solid}
.scan-text{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:3px;background:rgba(255,255,255,0.1);padding:4px 14px;border-radius:20px}
.result{background:#1a1a1a;border:1px solid #2a2a2a;padding:16px;border-radius:16px;margin-top:16px;line-height:1.7}
.btn{width:100%;background:#fff;color:#000;border:none;padding:14px;border-radius:12px;margin-top:12px;font-weight:600;cursor:pointer}
.small{font-size:11px;color:#777;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<h3>Mood Scan - Guess what people thinking</h3>

<div class="camera">
<video id="video" autoplay muted playsinline></video>
<div class="scan-line"></div>
<div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
<div class="scan-text">SCANNING</div>
</div>

<div class="result" id="res">
<b id="emoji" style="font-size:22px">😐</b> <span id="exp">Neutral</span><br>
<span style="color:#aaa">Feeling:</span> <span id="feel">Calm - Just chillin</span><br>
<span style="color:#aaa">Thinking:</span> <span id="think">"Hmm... maybe tired?"</span>
</div>

<button class="btn" onclick="save()">Save to Chat</button>
<div class="small">Saved chats appear in Friends & Others</div>
</div>

<script>
let vid=document.getElementById('video');
navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(s=>vid.srcObject=s);

const moods=[
{emoji:"😊",exp:"Happy",feel:"Happy & Vibin'",think:"Thinking about something good 🎵"},
{emoji:"😣",exp:"Stressed / Frowning",feel:"A bit annoyed",think:"Overthinking something? 💭"},
{emoji:"😌",exp:"Chill / Relaxed",feel:"Calm & peaceful",think:"Just vibin'... ✨"},
{emoji:"🤔",exp:"Confused / Curious",feel:"Deep in thoughts",think:"What should I do next?"},
{emoji:"🥺",exp:"Sad / Low",feel:"Feeling low today",think:"Need a break..."}
];
let i=0;
setInterval(()=>{
let m=moods[i%moods.length];
document.getElementById('emoji').innerText=m.emoji;
document.getElementById('exp').innerText=m.exp;
document.getElementById('feel').innerText=m.feel;
document.getElementById('think').innerText='"'+m.think+'"';
i++;
},2500);

function save(){
let txt=document.getElementById('res').innerText;
let chats=JSON.parse(localStorage.getItem('moodChats')||'[]');
chats.push({text:txt,time:new Date().toLocaleTimeString()});
localStorage.setItem('moodChats',JSON.stringify(chats));
alert('Saved! Check Friends & Others chat');
}
</script>
</body>
</html>
